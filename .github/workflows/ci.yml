name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

# Aynı PR'a yeni commit gelince önceki çalışma iptal edilir; main/dev push'ları tamamlanır.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
      TEST_DATABASE_URL: postgresql+psycopg://erp:erp@localhost:5432/erp_test
      SECRET_KEY: ci-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Migrations
        # Göçler sıfırdan uygulanır ve modellerle göçler arasında fark kalmadığı denetlenir.
        run: |
          alembic upgrade head
          alembic check
      - name: Dependency audit
        # Bilinen ve kabul edilen açıklar gerekçesiyle buraya eklenir: --ignore-vuln <ID>
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Test
        run: pytest --cov=app --cov-report=term --cov-fail-under=93

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: |
          npm run lint
          npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        # Kapsam eşikleri vite.config.ts içindedir
        run: npm run test:coverage
      - name: Build
        run: npx vite build
