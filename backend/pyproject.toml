[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI bağımlılıkları varsayılan argüman olarak Depends(...) kullanır
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
omit = ["app/benchmarks/*", "app/olist/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
