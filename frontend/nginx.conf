server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # İstek gövdesi üst sınırı
    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Önyüz API'yi /api altından çağırır; önek kaldırılarak arka uca iletilir.
    # Güvenlik başlıklarını arka uç kendisi ekler.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vite'ın ürettiği dosya adları içerik özetini içerir; uzun süre önbelleklenebilir.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html her seferinde yeniden doğrulanır; yeni sürüm hemen yüklenir.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Tek sayfa uygulama: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
