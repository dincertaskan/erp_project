# Üretim kurulumu: docker compose -f docker-compose.prod.yml up -d --build
# Zorunlu değişkenler (kök dizindeki .env ya da ortam): POSTGRES_PASSWORD, SECRET_KEY
# Veritabanı ve arka uç dışarıya açılmaz; yalnızca önyüz (nginx) HTTP_PORT üzerinden yayınlanır.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlanmalı}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlanmalı}@db:5432/${POSTGRES_DB:-erp}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY tanımlanmalı}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      STOCK_STRATEGY: ${STOCK_STRATEGY:-pessimistic}
      # Swagger, ReDoc ve OpenAPI şeması üretimde kapalıdır (404).
      ENABLE_DOCS: "false"
      # Arka uç yalnızca nginx'ten erişilebilir; uvicorn gerçek istemci adresini nginx'in X-Forwarded-For
      # başlığından alır (IP bazlı kayıt sınırı için gerekli).
      FORWARDED_ALLOW_IPS: "*"
      REGISTER_RATE_LIMIT: ${REGISTER_RATE_LIMIT:-5}
      REGISTER_RATE_WINDOW_MINUTES: ${REGISTER_RATE_WINDOW_MINUTES:-10}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
