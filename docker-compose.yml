services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-erp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-erp}
      POSTGRES_DB: ${POSTGRES_DB:-erp}
    ports:
      # Yalnızca bu bilgisayardan erişilir
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-erp} -d ${POSTGRES_DB:-erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp}@db:5432/${POSTGRES_DB:-erp}
      # Deney 1: STOCK_STRATEGY=pessimistic|optimistic|none, UVICORN_WORKERS=4
      STOCK_STRATEGY: ${STOCK_STRATEGY:-pessimistic}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
      # Worker başına bağlantı havuzu; worker × (havuz + taşma) < PostgreSQL max_connections (100)
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      # Önyüz konteynerindeki geliştirme sunucusu istemci adresini X-Forwarded-For ile iletir; kayıt sınırı
      # IP başına uygulanır. Ekipçe elle test ederken sınır dar gelirse backend/.env içinde REGISTER_RATE_LIMIT artırılır.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Olist CSV dosyaları (git dışında); aktarım betiği buradan okur
      - ./backend/data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  # Testler Python 3.12 ile konteynerde: docker compose --profile test run --rm backend-test
  # Kod ve testler canlı bağlanır; yalnızca bağımlılıklar değişince imajı yeniden derleyin (--build).
  backend-test:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp}@db:5432/erp_test
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-erp}:${POSTGRES_PASSWORD:-erp}@db:5432/erp_test
      SECRET_KEY: test-secret-key-for-pytest-only-not-for-production
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
